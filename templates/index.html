<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>IP Check</title>

<style>

body {
    margin: 0;
    background: #0d1117;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.box {
    width: 380px;
    background: #161b22;

    padding: 35px;

    border-radius: 16px;

    text-align: center;
}

h1 {
    margin-bottom: 15px;
}

p {
    color: #9da7b3;
    line-height: 1.5;
}

button {

    margin-top: 20px;

    padding: 14px 25px;

    border: none;
    border-radius: 10px;

    background: #5865f2;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #4752c4;
}

</style>

</head>

<body>

<div class="box">

<h1>IP Check</h1>

<p>
Wenn du auf den Button klickst, stimmst du zu,
dass deine öffentliche IP-Adresse an den Betreiber
dieser Seite übermittelt und protokolliert wird.
</p>

<form action="/share" method="POST">

<button type="submit">
IP-Adresse teilen
</button>

</form>

</div>

</body>

</html>
