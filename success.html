<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>IP geteilt</title>

<style>

body {
    margin: 0;

    background: #0d1117;
    color: white;

    font-family: Arial;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.box {
    background: #161b22;

    padding: 35px;

    border-radius: 16px;

    text-align: center;
}

.ip {
    font-size: 28px;
    font-weight: bold;

    margin-top: 20px;
}

</style>

</head>

<body>

<div class="box">

<h2>IP erfolgreich geteilt</h2>

<p>Deine öffentliche IP-Adresse:</p>

<div class="ip">
{{ ip }}
</div>

</div>

</body>

</html>
